<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}MiniBoard{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 780px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #222; }
    nav a { margin-right: 1rem; }
    .post { border: 1px solid #ddd; padding: .8rem 1rem; margin: .6rem 0; border-radius: 6px; background: #fafafa; }
    .error { color: #b00; font-weight: 600; }
    .success { color: #070; font-weight: 600; }
    pre { background: #f5f5f5; padding: .8rem; overflow-x: auto; border-radius: 4px; }
    .muted { color: #777; font-size: .9em; }
    .banner { background: #ffe0e0; border: 1px solid #d00; color: #a00; padding: .6rem 1rem; border-radius: 6px; font-weight: 600; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="banner">⚠️ Intentionally vulnerable lab. Localhost only.</div>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('search') }}">Search</a>
    <a href="{{ url_for('messages') }}">Messages</a>
    {% if user %}
      <a href="{{ url_for('new_post') }}">New post</a>
      <a href="{{ url_for('report') }}">Report URL</a>
      <a href="{{ url_for('exfil_log') }}">Attacker log</a>
      {% if user['is_admin'] %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
      <span style="float:right">{{ user['username'] }} · <a href="{{ url_for('logout') }}">logout</a></span>
    {% else %}
      <a href="{{ url_for('login') }}">Login</a>
      <a href="{{ url_for('register') }}">Register</a>
    {% endif %}
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
