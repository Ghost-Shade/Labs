{% extends "base.html" %}
{% block content %}
<h1>MiniBoard</h1>
{% for post in posts %}
  <div class="post">
    <h3><a href="{{ url_for('view_post', post_id=post['id']) }}">{{ post['title'] }}</a></h3>
    <div class="muted">by {{ post['author'] }} · {{ post['created_at'] }}</div>
  </div>
{% else %}
  <p class="muted">No posts yet.</p>
{% endfor %}
{% endblock %}
