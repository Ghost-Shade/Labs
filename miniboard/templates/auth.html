{% extends "base.html" %}
{% block content %}
<h1>{{ 'Register' if mode == 'register' else 'Login' }}</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <p><input name="username" placeholder="username" autofocus></p>
  <p><input name="password" type="password" placeholder="password"></p>
  <p><button type="submit">{{ 'Register' if mode == 'register' else 'Login' }}</button></p>
</form>
<p class="muted">
  Seed accounts: <code>admin/admin</code>, <code>alice/alice</code>, <code>bob/bob</code>.
</p>
{% endblock %}
